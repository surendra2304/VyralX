x-vyralx-common: &vyralx-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  environment:
    APP_ENV: production
    PORT: "8000"
    API_KEY: ${API_KEY:?Set API_KEY in Dokploy environment}
    DATABASE_URL: sqlite:////app/data/vyralx.db
    DATA_DIR: /app/data
    MEDIA_DIR: /app/media
    RENDER_DIR: /app/renders
    MAX_CONCURRENT_RENDERS: "1"
    MAX_UPLOAD_MB: "2048"
    WORKER_REQUIRED: "true"
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${WORKER_HEARTBEAT_TIMEOUT_SECONDS:-90}
    WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
    YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
    PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    YOUTUBE_UPLOAD_ENABLED: ${YOUTUBE_UPLOAD_ENABLED:-false}
    YOUTUBE_DEFAULT_PRIVACY: ${YOUTUBE_DEFAULT_PRIVACY:-private}
    YOUTUBE_CLIENT_SECRETS_FILE: /app/secrets/youtube-client-secret.json
    YOUTUBE_TOKEN_FILE: /app/secrets/youtube-token.json
    INFERENCE_URL: ${INFERENCE_URL:-}
    INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
    INFERENCE_MODEL: ${INFERENCE_MODEL:-}
    INFERENCE_GENERATION_PATH: ${INFERENCE_GENERATION_PATH:-/v1/chat/completions}
    INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-60}
    INFERENCE_TTS_PATH: ${INFERENCE_TTS_PATH:-/v1/audio/speech}
    INFERENCE_TTS_MODEL: ${INFERENCE_TTS_MODEL:-}
    INFERENCE_TTS_VOICE: ${INFERENCE_TTS_VOICE:-alloy}
    INFERENCE_TTS_TIMEOUT_SECONDS: ${INFERENCE_TTS_TIMEOUT_SECONDS:-180}
    FRIDAY_URL: ${FRIDAY_URL:-}
    FRIDAY_API_KEY: ${FRIDAY_API_KEY:-}
    INTELX_URL: ${INTELX_URL:-}
    INTELX_API_KEY: ${INTELX_API_KEY:-}
    MEMORA_URL: ${MEMORA_URL:-}
    MEMORA_API_KEY: ${MEMORA_API_KEY:-}
    SENTINEL_URL: ${SENTINEL_URL:-}
    SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
    SENTINEL_REQUIRED_FOR_PUBLISH: ${SENTINEL_REQUIRED_FOR_PUBLISH:-false}
    SENTINEL_POLICY_PATH: ${SENTINEL_POLICY_PATH:-}
  volumes:
    - vyralx-data:/app/data
    - vyralx-media:/app/media
    - vyralx-renders:/app/renders
    - vyralx-secrets:/app/secrets
  networks:
    - friday_mesh
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  vyralx:
    <<: *vyralx-common
    container_name: vyralx
    mem_limit: 320m
    cpus: 0.35
    depends_on:
      vyralx-worker:
        condition: service_started

  vyralx-worker:
    <<: *vyralx-common
    container_name: vyralx-worker
    command: ["python", "-m", "app.worker"]
    mem_limit: 512m
    cpus: 0.65
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import datetime,json,pathlib,sys; p=pathlib.Path('/app/data/worker-heartbeat.json'); d=json.loads(p.read_text()); t=datetime.datetime.fromisoformat(d['updated_at']); sys.exit(0 if (datetime.datetime.now(datetime.timezone.utc)-t.astimezone(datetime.timezone.utc)).total_seconds()<90 and d['state']!='stopped' else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  friday_mesh:
    external: true

volumes:
  vyralx-data:
  vyralx-media:
  vyralx-renders:
  vyralx-secrets:
