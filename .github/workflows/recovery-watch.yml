name: VyralX Recovery Watch

on:
  workflow_run:
    workflows: ["VyralX CI"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: vyralx-recovery-watch
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile main CI status and maintain one recovery incident
        uses: actions/github-script@v9
        with:
          script: |
            const title = "[automation] VyralX main CI needs attention";
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "ci.yml", branch: "main", per_page: 1,
            });
            const latest = runs.data.workflow_runs[0];
            if (!latest) {
              core.info("No main-branch CI run exists yet; nothing to reconcile.");
              return;
            }

            const isTerminal = latest.status === "completed";
            const isHealthy = isTerminal && latest.conclusion === "success";
            const isUnhealthy = isTerminal && latest.conclusion !== "success";
            const response = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100,
            });
            const incidents = response.data.filter(
              issue => !issue.pull_request && issue.title === title
            );

            if (isUnhealthy) {
              const body = [
                "## Automated CI recovery notice",
                "",
                "The latest completed GitHub Actions run for main did not succeed.",
                "",
                "- **Workflow:** " + latest.name,
                "- **Conclusion:** " + latest.conclusion,
                "- **Commit:** " + latest.head_sha,
                "- **Run:** " + latest.html_url,
                "",
                "### Recovery checklist",
                "1. Open the run and inspect the first failed step and its logs.",
                "2. Reproduce the failure locally where possible.",
                "3. Fix the underlying cause on a feature branch; add a regression test when applicable.",
                "4. Push the complete fix and confirm all required CI jobs pass.",
                "5. This issue will be closed automatically after a successful main CI run.",
                "",
                "This issue is generated by .github/workflows/recovery-watch.yml. It does not deploy code or blindly rerun failed jobs.",
              ].join("\n");
              if (incidents.length) {
                const incident = incidents[0];
                await github.rest.issues.update({
                  owner, repo, issue_number: incident.number, body,
                });
                for (const duplicate of incidents.slice(1)) {
                  await github.rest.issues.update({
                    owner, repo, issue_number: duplicate.number,
                    state: "closed", state_reason: "not_planned",
                  });
                }
                core.warning("Updated recovery incident #" + incident.number + " for " + latest.conclusion + ".");
              } else {
                const created = await github.rest.issues.create({ owner, repo, title, body });
                core.warning("Created recovery incident #" + created.data.number + " for " + latest.conclusion + ".");
              }
            } else if (isHealthy) {
              for (const incident of incidents) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: incident.number,
                  body: "Resolved automatically: latest main CI run succeeded for commit " +
                    latest.head_sha + ". Run: " + latest.html_url,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: incident.number,
                  state: "closed", state_reason: "completed",
                });
              }
              core.info("Latest main CI is green (" + latest.head_sha + "); closed " + incidents.length + " recovery incident(s).");
            } else {
              core.info("Latest main CI is still " + latest.status + "; no incident created while it is in progress.");
            }
