name: VyralX CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
concurrency:
  group: vyralx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for exposed credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Export dependency lock for this explicit maintainer run
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[lock-export]')
        run: |
          python -m pip install "uv==0.12.10"
          uv lock --python 3.11
          python - <<'PY'
          import base64
          from pathlib import Path

          encoded = base64.b64encode(Path("uv.lock").read_bytes()).decode("ascii")
          print("VYRALX_LOCK_BASE64_BEGIN")
          for index, start in enumerate(range(0, len(encoded), 2000)):
              print(f"VYRALX_LOCK_BASE64_{index:04d}={encoded[start:start + 2000]}")
          print("VYRALX_LOCK_BASE64_END")
          PY
      - name: Lint
        run: ruff check app tests scripts
      - name: Test
        run: pytest
      - name: Build container
        run: docker build --progress=plain -t vyralx:ci .
      - name: Scan container OS and Python-library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "vyralx:ci"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
      - name: Validate Compose deployment model
        env:
          API_KEY: ci-only-not-a-real-secret
        run: docker compose config --quiet
      - name: Audit installed Python dependencies
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip freeze | grep -v '^-e ' > /tmp/vyralx-audit-requirements.txt
          pip-audit --strict --no-deps --requirement /tmp/vyralx-audit-requirements.txt
