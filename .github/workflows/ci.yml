name: VyralX CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
concurrency:
  group: vyralx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts
      - name: Test
        run: pytest
      - name: Build container
        run: docker build --progress=plain -t vyralx:ci .
      - name: Validate Compose deployment model
        env:
          API_KEY: ci-only-not-a-real-secret
        run: docker compose config --quiet
      - name: Audit installed Python dependencies
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip freeze | grep -v '^-e ' > /tmp/vyralx-audit-requirements.txt
          pip-audit --strict --no-deps --requirement /tmp/vyralx-audit-requirements.txt
