name: VyralX CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
concurrency:
  group: vyralx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for exposed credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked application and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.13.1"
          uv sync --frozen --extra dev --no-editable --no-cache
      - name: Verify dependency lock matches project metadata
        run: uv lock --check --python 3.11
      - name: Lint
        run: uv run --frozen --extra dev ruff check app tests scripts
      - name: Test
        run: uv run --frozen --extra dev pytest
      - name: Build container
        run: docker build --progress=plain --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" -t vyralx:ci .
      - name: Compare two independent clean OCI image builds
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct)"
          builder_a="vyralx-repro-a-$GITHUB_RUN_ID"
          builder_b="vyralx-repro-b-$GITHUB_RUN_ID"
          output_a="$RUNNER_TEMP/vyralx-a.oci.tar"
          output_b="$RUNNER_TEMP/vyralx-b.oci.tar"

          cleanup() {
            docker buildx rm "$builder_a" >/dev/null 2>&1 || true
            docker buildx rm "$builder_b" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          build_oci() {
            local builder="$1"
            local output="$2"
            docker buildx create --name "$builder" --driver docker-container
            docker buildx inspect --bootstrap "$builder"
            SOURCE_DATE_EPOCH="$source_date_epoch" docker buildx build \
              --builder "$builder" \
              --platform linux/amd64 \
              --no-cache \
              --pull \
              --provenance=false \
              --build-arg "SOURCE_DATE_EPOCH=$source_date_epoch" \
              --output "type=oci,dest=$output,rewrite-timestamp=true,compression=gzip,compression-level=9,force-compression=true" \
              .
            docker buildx rm "$builder" >/dev/null
          }

          build_oci "$builder_a" "$output_a"
          build_oci "$builder_b" "$output_b"
          python scripts/compare_oci_images.py "$output_a" "$output_b"
      - name: Scan container OS and Python-library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "vyralx:ci"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
      - name: Validate Compose deployment model
        env:
          API_KEY: ci-only-not-a-real-secret
        run: docker compose config --quiet
      - name: Audit locked Python dependencies
        run: |
          python -m pip install --upgrade pip-audit
          uv export --frozen --all-extras --no-emit-project --format requirements-txt --output-file /tmp/vyralx-audit-requirements.txt
          pip-audit --strict --no-deps --requirement /tmp/vyralx-audit-requirements.txt
